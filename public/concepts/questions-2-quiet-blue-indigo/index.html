<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Questions 2 - Quiet Power (Blue + Indigo) · Forge</title>
<link rel="icon" href="../../assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Questions 2 - Quiet Power, Blue + Indigo.
   *
   * The question screen in the language of 8-quiet-dark-blue-indigo (its sibling landing page): the
   * canvas #101014, one hairline of white for every boundary, no second grey, and the app's two primary
   * colours doing two jobs - Blue 400 (#33BFFF) leads, Indigo 400 (#868AFD) supports. The selected tile
   * wears the same treatment as that page's "ready" card: a blue border, a blue bloom under it, and a
   * blue-to-indigo edge highlight along the top.
   *
   * Only the frame is fixed, and it is the app's own: a 72px bar with the 44px Epic mark, a 1136px column,
   * and the shared chrome.css linked last. No footer: this is a screen of the app, not a pitch page. */
  @font-face {
    font-family: "Inter";
    src: url("../../assets/fonts/inter-latin-variable.woff2") format("woff2");
    font-weight: 100 900; font-display: swap;
  }
  :root {
    color-scheme: dark;
    --bg: #101014;            /* the app's canvas, as on every screen */
    --tile: #18181C;          /* elevated-low: what a tile sits on */
    --rail: #202024;          /* elevated-medium: nothing here needs it, the strip does */
    --line: #28282C;          /* the hairline between surfaces */
    --muted: #ACACAD;
    --dim: #787678;
    /* Main: --color-palette-blue-400. Secondary: --color-palette-indigo-400. */
    --accent: #33BFFF;
    --accent-2: #868AFD;
    --accent-ink: #0A2633;    /* blue-100: the label on a blue fill, never black */
    --hairline: rgba(255, 255, 255, .09);
    --glass: rgba(255, 255, 255, .06);
    --ease: cubic-bezier(.2, .7, .2, 1);
    --title: "Inter Tight", "Inter", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: #fff;
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    padding-block: 0 72px;
    position: relative;
  }
  a { color: inherit; }
  .wrap { margin: 0 auto; }

  /* ---------- the 72px bar: the mark and the wordmark, nothing else ---------- */
  header { height: 72px; display: flex; align-items: center; }

  /* ---------- the screen's own strapline ---------- */
  .ledge {
    color: var(--muted);
    text-align: center;
    font-size: clamp(15px, 1.4vw, 18px);
    max-width: 54em;
    margin: 30px auto 0;
  }

  /* The one flourish 8-quiet-dark-blue-indigo carries, and the reason its dark canvas does not read as
     flat: a blue heart with an indigo falloff, behind everything, at the top of the page. It is a
     pseudo-layer rather than an element so nothing in the layout can depend on it - and it is measured
     in vw rather than px so that a 130%-wide heart cannot push a phone into horizontal scroll. */
  .glow {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: min(1000px, 100vw); height: 420px;
    pointer-events: none;
    background: radial-gradient(closest-side, rgba(51, 191, 255, .11), rgba(134, 138, 253, .06) 58%, transparent);
  }
  header, main { position: relative; }

  /* ---------- where you are, and how far is left ---------- */
  .meta {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    margin: 52px 0 14px;
  }
  .eyebrow {
    font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 0;
  }
  .count { margin: 0; font-size: 13px; letter-spacing: .02em; color: var(--accent-2); }
  .track {
    height: 3px; border-radius: 3px;
    background: rgba(255, 255, 255, .12);
    overflow: hidden;
  }
  .track > span {
    display: block; height: 100%; width: 4%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .45s var(--ease);
  }

  /* ---------- the question ---------- */
  .panel { padding-block: 34px 0; }
  h1 {
    font-family: var(--title);
    font-weight: 700;
    font-size: clamp(26px, 2.7vw, 42px);
    line-height: 1.04;
    letter-spacing: -.03em;
    margin: 0;
  }
  h1:focus { outline: none; }
  .sub { color: var(--muted); font-size: clamp(15px, 1.15vw, 18px); margin: 14px 0 0; max-width: 46em; }

  /* ---------- the answers ---------- */
  .tiles {
    list-style: none; padding: 0; margin: 34px 0 0;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .tile {
    position: relative; isolation: isolate; overflow: hidden;
    width: 100%; height: 100%; min-height: 152px;
    text-align: left; font: inherit; color: inherit;
    background: var(--tile);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 24px 24px 22px;
    display: flex; flex-direction: column;
    cursor: pointer;
    transition: background .3s, border-color .3s, transform .35s var(--ease), box-shadow .45s var(--ease);
  }
  /* Fills strengthen and the border warms toward the secondary; the lift is small, because on this page
     the tile is a control rather than a poster. */
  .tile:hover { background: rgba(255, 255, 255, .055); border-color: rgba(134, 138, 253, .5); transform: translateY(-3px); }
  /* The chosen answer, in the treatment 8-quiet-dark-blue-indigo gives its ready card. */
  .tile[aria-pressed="true"] {
    border-color: rgba(51, 191, 255, .6);
    box-shadow: 0 0 0 1px rgba(51, 191, 255, .15), 0 30px 90px -36px rgba(51, 191, 255, .55);
  }
  .tile[aria-pressed="true"]::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; z-index: 2;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
  }
  .tile .t {
    font-family: var(--title); font-weight: 700;
    font-size: clamp(17px, 1.45vw, 22px); line-height: 1.15; letter-spacing: -.02em;
  }
  .tile .d { color: var(--muted); font-size: clamp(14px, 1.05vw, 16px); line-height: 1.55; margin-top: 8px; }
  /* The draft tag is the supporting colour's job. */
  .tile .badge {
    align-self: flex-start; margin-top: auto; padding-top: 14px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: #A6A9FE; /* indigo-500: the same hue, lifted until it passes on this tile */
    border: 1px solid rgba(134, 138, 253, .45); border-radius: 999px;
    padding: 5px 11px;
  }

  .note {
    color: var(--muted); font-size: 14px; margin: 26px 0 0;
    border-left: 2px solid var(--accent-2); padding-left: 12px;
  }
  .note.error { color: #FE8989; border-left-color: #FE8989; }

  /* ---------- the controls ---------- */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 40px 0 0; }
  .btn {
    font-family: var(--body); font-weight: 700; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none; cursor: pointer;
    padding: 14px 24px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .18);
    background: var(--glass);
    color: #fff;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background .3s, border-color .3s, color .3s, box-shadow .3s var(--ease);
  }
  .btn:hover { background: rgba(134, 138, 253, .14); border-color: rgba(134, 138, 253, .55); }
  /* Dev mode is a state, so it reads as one: the blue fill and its own dark label. */
  .btn[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn[aria-pressed="true"]::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-ink);
  }
  .btn[aria-pressed="true"]:hover { background: #69D0FF; border-color: transparent; }
  .btn-toggle { margin-left: auto; }

  .tile:focus-visible, .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---------- the tag every mock-up carries ---------- */
  .tag {
    position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    color: var(--muted); background: rgba(24, 24, 28, .9);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 11px; pointer-events: none;
  }

  @media (max-width: 1020px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 700px) {
    .ledge { margin-top: 22px; }
    .meta { margin-top: 32px; }
    .panel { padding-block: 26px 0; }
    .tiles { grid-template-columns: 1fr; gap: 12px; }
    .tile { min-height: 0; padding: 20px 20px 18px; }
    .btn-toggle { margin-left: 0; }
    .controls .btn { flex: 1 1 auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
<link rel="stylesheet" href="../_shared/chrome.css" />
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<header class="wrap">
  <a class="logo-lockup" href="../../index.html#/home" aria-label="Forge home">
    <span class="logo-wrap"><img class="logo-img" src="../../assets/logo_epic.svg" alt="Epic Games" width="44" height="44"></span>
    <span class="logo-word">Forge</span>
  </a>
</header>

<main class="wrap">
  <p class="ledge">Design your game, then follow a step-by-step walkthrough — with video — to actually build it.</p>

  <div class="meta">
    <p class="eyebrow" id="stepLabel">Step 1 of 2</p>
    <p class="count" id="count"></p>
  </div>
  <div class="track" role="progressbar" aria-label="Question progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
    <span id="progressFill"></span>
  </div>

  <section class="panel" aria-live="polite">
    <h1 id="question" tabindex="-1">What type of game do you want to make?</h1>
    <p class="sub" id="sub">Pick the broad category first — you'll choose the exact game type next.</p>
    <ul class="tiles" id="grid"></ul>
    <p class="note" id="note" hidden></p>
    <div class="controls">
      <a class="btn" id="back" href="../../index.html#/home">← Back to my games</a>
      <button class="btn btn-toggle" id="devMode" type="button" aria-pressed="false" title="Show draft game types too">Dev mode</button>
    </div>
  </section>
</main>

<div class="tag">Questions 2 - Quiet Power &middot; Blue + Indigo</div>

<script src="questions.js"></script>
<!-- Plain script, not a module: a browser blocks this page's data fetch on a file:// page, so this one
     hands the browser over to the server address where the tiles do load. -->
<script src="../../js/local-server-check.js"></script>
</body>
</html>
