<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Questions 8 - Guide · Forge</title>
<link rel="icon" href="../../assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Questions 8 - Guide.
   *
   * The least landing-page of the four and the most like a screen inside the app: a guide rail on the left
   * that names the whole journey, the current question on the right, and the answers as a list of rows with
   * a radio at the head of each one.
   *
   * This is Epic's own shape rather than a card grid invented for a marketing page. The rail's steps come
   * from the data the app already stores for each game type - devices, base settings, layout tip, core loop
   * - so step 3 is Devices, step 4 Settings, step 5 Build plan, and the progress the guide reports (4% for
   * the first question, 12% for the second) is reported on the rail, where a rail's progress belongs.
   *
   * Tokens: --color-background-elevated-low-default (#18181C) for the row surface, --color-border-subtle
   * (#ffffff26) for the dividers, --color-text-secondary (#ffffffA6), --color-text-select-default (#26BBFF)
   * for the chosen row's radio and the rail's current marker, and --color-border-focus (#fff) for the
   * keyboard ring. The rows do not move on hover - the fill changes, which is what Epic's own controls do. */
  @font-face {
    font-family: "Inter";
    src: url("../../assets/fonts/inter-latin-variable.woff2") format("woff2");
    font-weight: 100 900; font-display: swap;
  }
  :root {
    color-scheme: dark;
    --canvas: #101014;                 /* --color-background-default */
    --row-hover: #FFFFFF0A;
    --row-select: #FFFFFF1A;           /* --color-border-subdued as a fill: the chosen row */
    --text-primary: #FFFFFF;
    --text-secondary: #FFFFFFA6;       /* --color-text-secondary */
    --text-muted: #FFFFFF59;           /* --color-border-default, as the quietest text */
    --border-subtle: #FFFFFF26;
    --border-hover: #FFFFFFA6;
    --border-focus: #FFFFFF;
    --select: #26BBFF;                 /* --color-text-select-default */
    --select-ink: #0A2633;
    --indigo: #868AFD;
    --title: "Inter Tight", "Inter", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.25, 1, .5, 1);
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html { background: var(--canvas); }
  body {
    margin: 0; background: var(--canvas); color: var(--text-primary);
    font-family: var(--body); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
    padding-block: 0 80px;
  }
  a { color: inherit; }
  header { height: 72px; display: flex; align-items: center; }

  /* ---------- rail + content ---------- */
  .layout {
    display: grid; grid-template-columns: 244px minmax(0, 1fr);
    gap: 56px; align-items: start;
    padding-block: 48px 0;
  }
  .rail { position: sticky; top: 24px; }
  .rail h2 {
    margin: 0 0 18px;
    font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-secondary);
  }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .steps li { display: flex; align-items: flex-start; gap: 12px; padding: 7px 0 7px 12px; position: relative; }
  .steps li .mk {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
    background: #FFFFFF08;
  }
  .steps li .lbl { font-size: 14px; letter-spacing: .02em; color: var(--text-muted); line-height: 22px; }
  /* the step the guide is on */
  .steps li[aria-current="step"] { background: rgba(38, 187, 255, .07); border-radius: 6px; }
  .steps li[aria-current="step"]::before {
    content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; border-radius: 2px;
    background: var(--select);
  }
  .steps li[aria-current="step"] .mk { background: var(--select); border-color: var(--select); color: var(--select-ink); font-weight: 700; }
  .steps li[aria-current="step"] .lbl { color: var(--text-primary); font-weight: 500; }
  .steps li[data-done="true"] .mk { border-color: var(--border-hover); color: var(--text-secondary); }
  .steps li[data-done="true"] .lbl { color: var(--text-secondary); }

  .rail .prog { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle); }
  .rail .prog p { margin: 0 0 10px; font-size: 12px; letter-spacing: .03em; color: var(--text-secondary); display: flex; justify-content: space-between; }
  .rail .prog b { color: var(--text-primary); font-weight: 500; }
  .bar { height: 4px; border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 4%; border-radius: 999px; background: linear-gradient(90deg, #33BFFF, var(--indigo)); transition: width .3s var(--ease); }

  /* ---------- the question ---------- */
  .kicker {
    display: flex; align-items: center; gap: 10px; margin: 0;
    font-size: 12px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase; color: var(--text-secondary);
  }
  h1 {
    font-family: var(--title); font-weight: 700;
    font-size: clamp(24px, 2.5vw, 34px); line-height: 1.15;
    letter-spacing: -.025em; margin: 14px 0 0; max-width: 22em;
  }
  h1:focus { outline: none; }
  .sub { color: var(--text-secondary); font-size: 16px; line-height: 1.65; margin: 12px 0 0; max-width: 46em; }

  /* ---------- the rows ---------- */
  .rows {
    list-style: none; margin: 28px 0 0; padding: 0;
    border: 1px solid var(--border-subtle); border-radius: var(--radius); overflow: hidden;
    background: #FFFFFF05;
  }
  .rows li + li .row { border-top: 1px solid var(--border-subtle); }
  .row {
    display: flex; align-items: flex-start; gap: 16px; width: 100%; text-align: left;
    font: inherit; color: inherit; cursor: pointer;
    background: transparent; border: 0; padding: 18px 20px;
    transition: background .125s var(--ease);
  }
  .row:hover { background: var(--row-hover); }
  .row[aria-pressed="true"] { background: var(--row-select); }
  .row .radio {
    flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .35);
    display: grid; place-items: center;
    transition: border-color .125s var(--ease);
  }
  .row .radio::after {
    content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--select);
    transform: scale(0); transition: transform .125s var(--ease);
  }
  .row[aria-pressed="true"] .radio { border-color: var(--select); }
  .row[aria-pressed="true"] .radio::after { transform: scale(1); }
  .row .txt { min-width: 0; }
  .row .t { display: block; font-size: 16px; font-weight: 500; letter-spacing: .01em; }
  .row .d { display: block; color: var(--text-secondary); font-size: 14px; line-height: 1.5; letter-spacing: .02em; margin-top: 5px; }
  .row .meta {
    margin-left: auto; flex: none; padding-left: 16px;
    font-size: 12px; font-weight: 500; letter-spacing: .03em; color: var(--text-secondary);
    text-align: right; white-space: nowrap;
  }
  .row .meta.live { color: #45C761; }
  .row .meta.draft { color: #FFC229; }

  .note { display: flex; gap: 10px; align-items: flex-start; margin: 20px 0 0; font-size: 14px; letter-spacing: .02em; color: var(--text-secondary); }
  .note[hidden] { display: none; }
  .note::before { content: ""; flex: none; width: 3px; align-self: stretch; min-height: 18px; border-radius: 2px; background: var(--indigo); }
  .note.error { color: #FF8291; }
  .note.error::before { background: #FF3F56; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 36px 0 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 44px; padding: 0 20px;
    font-family: var(--body); font-size: 14px; font-weight: 500; letter-spacing: .02em;
    text-decoration: none; cursor: pointer; border: 0; border-radius: var(--radius);
    background: #FFFFFF26; color: var(--text-primary);   /* --color-fill-secondary-default */
    transition: background .125s var(--ease);
  }
  .btn:hover { background: #FFFFFF59; }                  /* --color-fill-secondary-hover */
  .chipbtn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px;
    font-family: var(--body); font-size: 14px; font-weight: 500; letter-spacing: .02em; cursor: pointer;
    border-radius: 999px; background: #FFFFFF0D; border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    transition: background .125s var(--ease), border-color .125s var(--ease), color .125s var(--ease);
  }
  .chipbtn:hover { background: #FFFFFF1A; color: var(--text-primary); }
  .chipbtn .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
  .chipbtn[aria-pressed="true"] { background: rgba(134, 138, 253, .16); border-color: rgba(134, 138, 253, .45); color: #A6A9FE; }
  .chipbtn[aria-pressed="true"] .dot { background: var(--indigo); }
  .actions .chipbtn { margin-left: auto; }

  .row:focus-visible, .btn:focus-visible, .chipbtn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

  .tag {
    position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    font-size: 11px; font-weight: 500; letter-spacing: .03em;
    color: var(--text-secondary); background: rgba(16, 16, 20, .9);
    border: 1px solid var(--border-subtle); border-radius: 999px;
    padding: 6px 12px; pointer-events: none;
  }

  @media (max-width: 940px) {
    .layout { grid-template-columns: 1fr; gap: 28px; padding-block: 30px 0; }
    .rail { position: static; }
    .steps { flex-direction: row; flex-wrap: wrap; gap: 8px; }
    .steps li { flex: 1 1 auto; }
    .steps li .lbl { display: none; }
    .rail .prog { margin-top: 16px; }
  }
  @media (max-width: 700px) {
    .row { flex-wrap: wrap; }
    .row .meta { margin-left: 36px; padding-left: 0; text-align: left; }
    .actions .chipbtn { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
<link rel="stylesheet" href="../_shared/chrome.css" />
</head>
<body>

<header class="wrap">
  <a class="logo-lockup" href="../../index.html#/home" aria-label="Forge home">
    <span class="logo-wrap"><img class="logo-img" src="../../assets/logo_epic.svg" alt="Epic Games" width="44" height="44"></span>
    <span class="logo-word">Forge</span>
  </a>
</header>

<main class="wrap layout">
  <aside class="rail" aria-label="Setup guide">
    <h2>Setup guide</h2>
    <ol class="steps" id="steps">
      <li data-step="1" aria-current="step"><span class="mk">1</span><span class="lbl">Category</span></li>
      <li data-step="2"><span class="mk">2</span><span class="lbl">Game type</span></li>
      <li data-step="3"><span class="mk">3</span><span class="lbl">Devices</span></li>
      <li data-step="4"><span class="mk">4</span><span class="lbl">Settings</span></li>
      <li data-step="5"><span class="mk">5</span><span class="lbl">Build plan</span></li>
    </ol>
    <div class="prog">
      <p><span>Step <b id="stepNow">1</b> of 2</span><span id="percentNow">4%</span></p>
      <div class="bar" role="progressbar" aria-label="Guide progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4" aria-valuetext="Step 1 of 2">
        <span id="progressFill"></span>
      </div>
    </div>
  </aside>

  <section>
    <p class="kicker"><span id="kicker">Step 1 · Category</span></p>
    <h1 id="question" tabindex="-1">What type of game do you want to make?</h1>
    <p class="sub" id="sub">Pick the broad category first — you'll choose the exact game type next.</p>

    <ul class="rows" id="grid" aria-live="polite"></ul>

    <p class="note" id="note" hidden></p>

    <div class="actions">
      <a class="btn" id="back" href="../../index.html#/home">Back to my games</a>
      <button class="chipbtn" id="devMode" type="button" aria-pressed="false" title="Show draft game types too">
        <span class="dot" aria-hidden="true"></span>Dev mode
      </button>
    </div>
  </section>
</main>

<div class="tag">Questions 8 - Guide</div>

<script src="questions.js"></script>
<!-- Plain script, not a module: a browser blocks this page's data fetch on a file:// page, so this one
     hands the browser over to the server address where the rows do load. -->
<script src="../../js/local-server-check.js"></script>
</body>
</html>
